<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ClubConnect</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <!-- Contact Header -->
    <header>
        <h1>Contact ClubConnect</h1>
    </header>

    <!-- Contact Form Section -->
    <section id="contact-form-section">
        <div class="contact-info">
            <h2>Connect with Us</h2>
            <p>If you're interested in listing your event with ClubConnect, please fill out the form below, and we'll get in touch!</p>
        </div>
        <form class="contact-form" action="#" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Your Name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Your Email">

            <label for="event-details">Event Details:</label>
            <textarea id="event-details" name="event-details" placeholder="Tell us about your event" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2024 ClubConnect. All rights reserved.</p>
    </footer>

</body>
</html>
